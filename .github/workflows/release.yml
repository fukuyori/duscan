name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            executable: duscan
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            executable: duscan.exe
          - name: macos-aarch64
            os: macos-latest
            target: aarch64-apple-darwin
            executable: duscan
          - name: macos-x86_64
            os: macos-15-intel
            target: x86_64-apple-darwin
            executable: duscan

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package Linux archive
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/${{ matrix.executable }} dist/
          cp README.md LICENSE dist/
          cd dist
          zip ../duscan-${{ github.ref_name }}-${{ matrix.name }}.zip *

      - name: Package macOS archive
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/${{ matrix.executable }} dist/
          cp README.md LICENSE dist/
          cd dist
          zip ../duscan-${{ github.ref_name }}-${{ matrix.name }}.zip *

      - name: Package Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.executable }}" dist/
          Copy-Item README.md, LICENSE dist/
          Compress-Archive -Path dist/* -DestinationPath "duscan-${{ github.ref_name }}-${{ matrix.name }}.zip"

      - name: Upload release archive
        uses: actions/upload-artifact@v4
        with:
          name: duscan-${{ github.ref_name }}-${{ matrix.name }}
          path: duscan-${{ github.ref_name }}-${{ matrix.name }}.zip
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Download release archives
        uses: actions/download-artifact@v4
        with:
          pattern: duscan-${{ github.ref_name }}-*
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/*.zip --generate-notes
